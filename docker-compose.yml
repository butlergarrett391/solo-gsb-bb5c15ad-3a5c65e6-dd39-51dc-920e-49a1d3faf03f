services:
  canary-gate:
    build: .
    image: gray-release-gate:latest
    container_name: gray-release-gate
    ports:
      - "8080:8080"
    environment:
      CANARY_DB_PATH: /data/canary.db
    volumes:
      - canary-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  canary-data:
